# dsh-session-messaging: top-level sessions can message each other.
#   crossWorkspace   allow listing and messaging sessions in other workspaces (false = same workspace only)
#   maxMessageBytes  size limit of one relayed message, including its attribution line
#   listLimit        default number of rows session_list returns (at most 100)
- insert:
    - id: session-messaging
      name: 'dsh-session-messaging'
      config:
        crossWorkspace: true
        maxMessageBytes: 65536
        listLimit: 20
