name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify version matches git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build release tarball and checksums
        run: |
          TGZ="$(npm pack --ignore-scripts | tail -n 1)"
          sha256sum "$TGZ" > SHA256SUMS.txt
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TGZ" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TGZ" SHA256SUMS.txt --generate-notes
          fi

      # Needs npm Trusted Publishing set up for this repo on npmjs.com; warns without failing the GitHub Release until configured.
      - name: Publish to npm (OIDC Trusted Publisher)
        run: |
          npm publish --provenance --access public || {
            echo "::warning::npm publish skipped or failed. Bind this repository + release.yml under npmjs.com Package Settings -> Trusted Publisher after initial publish."
          }
